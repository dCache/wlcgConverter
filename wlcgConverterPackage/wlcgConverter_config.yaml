###################wlcgConverter config file ###########################
#  Version: 2.0 (2026-10-26)

#config::authentication : ------------------one of the two logins is obligatory if send_data is True; both use TLS------------------------
#x509 :
path_to_cert:               #<-----client certificate for the broker login; used when path_to_key is set too. E.g.:"/etc/wlcg_converter/certs/hostcert.pem"
path_to_key:                #<-----key of that certificate. E.g.:"/etc/wlcg_converter/certs/hostkey.pem"
#passw_auth :
username:                   #<-----used when no certificate and key are set
password:

#config::AMQ :
amq_host: "dashb-lb-mb.cern.ch"                         #(obligatory if send_data is True) the broker's host name; its certificate must be issued for this name
amq_port: "61113"                                    #(not used) records are only sent over TLS, to <amq_port_tls>
amq_port_tls: "61123"                                   #(obligatory if send_data is True) TLS port of the broker
amq_ca_certs:                                           #(obligatory if send_data is True)<-----PEM file with the CA certificates that signed the broker's certificate; without it the broker is not verified. E.g.: "/etc/wlcg_converter/certs/cern-ca.pem"
amq_topic: "/topic/xrootd.dcache"                       #(obligatory if send_data is True)

#config::ip_filter :
ip_filter_is_active: False                             #(optional)<------configure if ip filtering of specified subnets is desired. (optional)
ipv4_network_address :                           #if <ip_filter_is_active> is set to True, a ipv4 network base address MUST be provided. E.g.: '123.456.0.0'
ipv4_cidr :                                                   #if <ip_filter_is_active> is set to True, a netmask in cidr notation MUST be provided. E.g.: '16'
ipv6_network_address :                          #if <ip_filter_is_active> is set to True, a ipv6 network base address MUST be provided. E.g.: '1234:456:700::'
ipv6_cidr :                                                 #if <ip_filter_is_active> is set to True, a  netmask in cidr notation MUST be provided. E.g.: '48'

#config::options :
protocol: "Xrootd"                                     #(optional) default: Xrootd; billing records of other protocols are skipped
local_dump: False                                     #(optional) if set to True  a local dump of the converted json is made to a location specified under 'path_to_converted_json_file '(optional)
verbose: False                                             #(optional) if set to True a high amount of logging output for debugging is written to the path specified below under 'filename'. Usually /var/log/ (optional)
send_data: False                       #(optional) default: False<-----MUST be set to True to start sending records to CERN

#config::path to local dump file :
path_to_converted_json_file :           # only obligatory if  "local_dump" is set to True. E.g.: "/path/to/wlcg_converted.json"

#config::kafka:
kafka_broker_incoming:            #(obligatory)<------your local kafka broker addresses as a list. E.g: ['it-kafka-broker42.site.com:1234', 'it-kafka-broker007.site.com:5678'] (obligatory)


#config::log_archiver :
instance :                                  # (obligatory) <-----name of the instance used for your kafka stream. E.g.: 'cms'  (obligatory)
topic :                                        # (obligatory)<------name of the kafka topic used by your kafka brokers. E.g.: 'billing-cms' (obligatory)

#config::schema : ---------------------settings for the v2 WLCG transfer record (see docs/RECORD.md)----------------------------------------
server_technology: "dcache"                    #(optional) default: dcache
server_site:                                    #(obligatory)<-----WLCG site name of this storage, as a quoted string. E.g.: "DESY-HH" (obligatory)
server_version:                                 #(obligatory)<-----dCache release of this instance, as a quoted string. E.g.: "10.2.5" (obligatory)
storage_instance:                               #(optional) name of the dCache instance; defaults to <instance>
local_networks:                                 #(optional) client IPs in these CIDRs belong to <server_site> => traffic_scope LAN. E.g.: ["131.169.0.0/16", "2001:638:700::/48"]
file_name_strip_prefixes: []                    #(optional) prefixes removed from file_path to build file_name; longest match wins. E.g.: ["/pnfs/desy.de/cms/tier2"]

#config::scitags : ----------------------SciTags registry for the activity field (see docs/RECORD.md)-----------------------------------------------
scitags_url: "https://scitags.org/api.json"     #(optional) https only; downloaded once at startup
scitags_cache_file:                             #(optional) the download is saved here and used when it fails; the directory must be writable. E.g.: "/var/lib/wlcg_converter/scitags.json"

#config::logging:------------------all denoted options below are optional---------------------------------------------------------------------
config::logging :
        version: 1
        formatters:
                simple:
                        format: "\n%(asctime)s - [%(name)s] - [%(funcName)s] - [%(levelname)s] - %(message)s"
        handlers:
                console:
                        class: logging.StreamHandler
                        level: INFO                                     #<----change to DEBUG if very verbose output is needed for debugging (optional)
                        formatter: simple
                        stream: ext://sys.stdout
                file:
                        class: logging.FileHandler
                        level: INFO                                     #<----change to DEBUG if very verbose output is needed for debugging (optional)
                        formatter: simple
                        filename: /var/log/wlcg_converter/wlcg_converter.log  # <----configure the path to the .log file; the directory must be writable by the service user (optional)
                        mode: a
        loggers:
                wlcgConverter:
                        level: INFO                             #<----change to DEBUG if very verbose output is needed for debugging (optional)
                        handlers: [ console, file ]
                        propagate: no
        root:
                level: DEBUG
                handlers: [ console, file ]

#######################################################################################################
                

