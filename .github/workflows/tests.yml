name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the minimum (stomp.py 9); the Docker image uses 3.12
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8
      - name: Check for syntax errors and undefined names
        run: flake8 wlcgConverterPackage tests --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run the tests (offline, no Kafka or broker needed)
        run: python -m pytest tests/
